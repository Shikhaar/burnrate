name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: burnrate
          POSTGRES_PASSWORD: burnrate
          POSTGRES_DB: burnrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - name: Unit + API tests
        run: pytest -q
      - name: Seed + smoke test against ${{ matrix.database }}
        env:
          BURNRATE_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://burnrate:burnrate@localhost:5432/burnrate' || 'sqlite:///./ci.db' }}
        run: |
          alembic upgrade head
          burnrate seed --days 45
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from burnrate.main import app
          with TestClient(app) as c:
              for path in ["/healthz", "/api/overview", "/api/breakdown?dimension=feature", "/api/timeseries",
                           "/api/anomalies", "/api/forecast", "/api/reconciliation", "/api/insights",
                           "/api/budgets", "/api/events", "/api/pricing", "/api/meta"]:
                  r = c.get(path)
                  assert r.status_code == 200, (path, r.status_code, r.text[:300])
              assert c.get("/api/overview").json()["total_cost_usd"] > 0

              # Ingestion on the real database: idempotency via ON CONFLICT, cost derivation, OTLP.
              from burnrate.db import SessionLocal
              from burnrate.security import create_api_key
              with SessionLocal() as s:
                  h = {"X-API-Key": create_api_key(s, "ci")}
              ev = {"provider": "openai", "model": "gpt-4o-2024-08-06", "input_tokens": 1000, "output_tokens": 100}
              r = c.post("/v1/events", json={"events": [{**ev, "request_id": "ci-1"}, {**ev, "request_id": "ci-1"}]},
                         headers=h).json()
              assert (r["accepted"], r["duplicates"]) == (1, 1), r
              r = c.post("/v1/events", json={"events": [{**ev, "request_id": "ci-1"}, {**ev, "request_id": "ci-2"}, ev]},
                         headers=h).json()
              assert (r["accepted"], r["duplicates"]) == (2, 1), r
              items = c.get("/api/events?limit=3").json()["items"]
              assert all(i["cost_usd"] > 0 for i in items), items
          print("smoke ok")
          EOF

  sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest && pytest -q

  sdk-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-package-lock && npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docker:
    # Builds every image and runs the full stack exactly as the README's Docker quickstart does.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start (waits for health checks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Seed demo data
        run: docker compose run --rm seed
      - name: Smoke test the running stack
        run: |
          set -euo pipefail
          curl -fsS localhost:8000/healthz
          test "$(curl -fsS 'localhost:8000/api/overview?days=30' | jq '.total_cost_usd > 0')" = true
          test "$(curl -fsS localhost:8000/api/anomalies | jq '.items | length > 0')" = true

          # Live ingestion through the API container, against Postgres.
          KEY=$(docker compose exec -T api burnrate create-key ci 2>/dev/null | tail -n1)
          EVENT='{"events":[{"provider":"openai","model":"gpt-4o","input_tokens":1000,"request_id":"docker-ci-1"}]}'
          curl -fsS -X POST localhost:8000/v1/events -H "X-API-Key: $KEY" -H 'content-type: application/json' -d "$EVENT" | tee /dev/stderr | jq -e '.accepted == 1'
          curl -fsS -X POST localhost:8000/v1/events -H "X-API-Key: $KEY" -H 'content-type: application/json' -d "$EVENT" | jq -e '.duplicates == 1'

          # Every dashboard route serves from the production build.
          for path in / /explore /requests /budgets /forecast /reconciliation /insights /pricing; do
            curl -fsS -o /dev/null -w "web $path %{http_code}\n" "localhost:3000$path"
          done
          curl -fsS localhost:3000 | grep -q Burnrate

          # API logs are structured JSON.
          docker compose logs api --no-log-prefix | grep '"logger": "burnrate.http"' | tail -n1 | jq -e '.request_id and .status'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
