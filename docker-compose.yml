services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: burnrate
      POSTGRES_PASSWORD: burnrate
      POSTGRES_DB: burnrate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burnrate"]
      interval: 5s
      retries: 10

  # Shared rate-limit state, so limits hold across API replicas (`docker compose up --scale api=3`
  # behind a load balancer).
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      BURNRATE_DATABASE_URL: postgresql+psycopg://burnrate:burnrate@db:5432/burnrate
      BURNRATE_REDIS_URL: redis://redis:6379/0
      BURNRATE_CORS_ORIGINS: '["http://localhost:3000"]'
      BURNRATE_LOG_FORMAT: json
      # Encrypts the Slack link and Jira token saved from Settings: `docker compose run --rm api burnrate
      # generate-secret-key`, then put BURNRATE_SECRET_KEY=... in a .env file next to this one.
      BURNRATE_SECRET_KEY: ${BURNRATE_SECRET_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot: loads 90 days of demo data. `docker compose run --rm seed`
  seed:
    build: ./backend
    command: ["burnrate", "seed"]
    environment:
      BURNRATE_DATABASE_URL: postgresql+psycopg://burnrate:burnrate@db:5432/burnrate
    depends_on:
      api:
        condition: service_healthy  # api runs migrations first
    profiles: ["seed"]

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
