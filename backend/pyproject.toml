[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "burnrate"
version = "0.1.0"
description = "AI spend intelligence: track, attribute, forecast and reconcile LLM token spend across providers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy>=2.1.8",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "httpx>=0.28.1",
  "pyyaml>=6.0.3",
  "psycopg[binary]>=3.3.8",
  "alembic>=1.20.1",
  "prometheus-client>=0.26.0",
  "redis>=8.1.0",
  "cryptography>=50.0.0",  # encrypts secrets saved from the dashboard (Slack link, Jira token)
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "fakeredis[lua]>=2.40.0"]

[project.scripts]
burnrate = "burnrate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/burnrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
