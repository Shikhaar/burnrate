    gemini-3-flash-preview:  { input: 0.50, output: 3.00,  cached_input: 0.05 }
    # 2.5 Pro and 2.5 Flash are deprecated: from 2026-12-01 their requests are routed to
    # gemini-3.8-flash and gemini-3.5-flash-lite and billed at those models' rates.
    gemini-2.5-pro:
      - { input: 1.25, output: 10.00, cached_input: 0.31 }
      - { input: 1.25, output: 10.00, cached_input: 0.125, effective_from: "2026-11-13" }
      - { input: 0.75, output: 3.75,  cached_input: 0.075, effective_from: "2026-12-01" }
      - { input: 1.50, output: 7.50,  cached_input: 0.15,  effective_from: "2027-01-01" }
    gemini-2.5-flash:
      - { input: 0.30, output: 2.50, cached_input: 0.075 }
      - { input: 0.30, output: 2.50, cached_input: 0.03, effective_from: "2026-11-13" }
    gemini-2.5-flash-lite:
      - { input: 0.10, output: 0.40, cached_input: 0.025 }
