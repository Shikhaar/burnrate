    gemini-embedding-2:      { input: 0.20, output: 0 }  # text input
    gemini-embedding-001:    { input: 0.15, output: 0 }
    text-embedding-004:      { input: 0.00, output: 0 }  # no longer listed
  mistral:
    # Aliases (also reached as *-latest) follow the newest model: Large 4 since its 2026-11-05 GA.
    mistral-large:
      - { input: 2.00, output: 6.00 }
      - { input: 0.70, output: 2.10, cached_input: 0.07, effective_from: "2026-11-05" }
